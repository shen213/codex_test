<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>行者无疆 - 首页</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

<section class="hero" id="home">
    <div class="hero-overlay"></div>
    <div class="hero-content">
        <h1 class="hero-title">
            <span class="title-line">让每一次出发</span>
            <span class="title-line highlight">都成为值得纪念的故事</span>
        </h1>
        <p class="hero-subtitle">从灵感、规划到启程，我们帮你把旅行愿望变成真实体验。</p>
        <div class="hero-search">
            <div class="search-box">
                <input type="text" placeholder="输入你向往的目的地" id="searchInput">
                <button class="search-btn">开始探索</button>
            </div>
        </div>
        <div class="hero-stats">
            <div class="stat">
                <span class="stat-number" data-target="500">0</span><span class="stat-suffix">+</span>
                <span class="stat-label">定制线路</span>
            </div>
            <div class="stat">
                <span class="stat-number" data-target="10000">0</span><span class="stat-suffix">+</span>
                <span class="stat-label">服务旅客</span>
            </div>
            <div class="stat">
                <span class="stat-number" data-target="96">0</span><span class="stat-suffix">%</span>
                <span class="stat-label">满意度</span>
            </div>
        </div>
    </div>
</section>

<section class="home-intro">
    <div class="section-header">
        <h2 class="section-title">首页导览</h2>
        <p class="section-subtitle">这是你的旅行起点：输入目的地、获取灵感、快速进入对应页面深入了解。</p>
        <div class="title-divider"></div>
    </div>
    <div class="features-grid">
        <div class="feature-card animate-on-scroll">
            <div class="feature-icon">🧭</div>
            <h3>一步定位灵感</h3>
            <p>用关键词搜索城市、主题或预算，快速得到适合你的旅行方向。</p>
        </div>
        <div class="feature-card animate-on-scroll">
            <div class="feature-icon">📅</div>
            <h3>清晰规划节奏</h3>
            <p>先确定出发季节和天数，再结合偏好筛选行程类型，效率更高。</p>
        </div>
        <div class="feature-card animate-on-scroll">
            <div class="feature-icon">✨</div>
            <h3>开启专属旅程</h3>
            <p>进入各功能页面查看更多细节，轻松完成从“想去”到“出发”。</p>
        </div>
    </div>
</section>

<script src="script.js"></script>
</body>
</html>
